name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a queued run supersedes an older one rather than
# cancelling a publish that is already halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Reports the sub-path the site will be served from, which the app needs
      # baked in: a project repo lives at /<repo>/, not at the domain root.
      - uses: actions/configure-pages@v5
        id: pages

      - run: npm ci

      # The catalogue data and images are committed, so the build needs neither
      # the source PDF nor the Python pipeline.
      - name: Build static site
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The site is ~220 MB across roughly 5,000 files — 3,384 product
          # photos, 72 page scans and 1,112 pages — and Pages regularly takes
          # longer than the action's 10-minute default to publish that.
          # The upload has already succeeded by then; only the wait gives up.
          timeout: 1800000
